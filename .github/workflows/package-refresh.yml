name: Refresh distribution package

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  package:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      !contains(github.event.workflow_run.head_commit.message, '[package-refresh]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build distribution ZIP
        run: |
          set -euo pipefail
          repo_dir="${GITHUB_WORKSPACE}"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          rsync -a \
            --exclude='.git' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='node_modules/' \
            --exclude='*.zip' \
            --exclude='.DS_Store' \
            --exclude='.!*!.DS_Store' \
            --exclude='.tmp*/' \
            --exclude='.cursor/' \
            --exclude='.gemini/' \
            --exclude='.codex/' \
            --exclude='.claude/' \
            --exclude='.agents/' \
            --exclude='scratch/' \
            --exclude='production_plugins/' \
            --exclude='luna-frontier/' \
            --exclude='src/styles/' \
            --exclude='src/scripts/' \
            --exclude='src/fonts/' \
            --exclude='src/*.js' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='test-results/' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpunit.xml.dist' \
            --exclude='.phpunit.result.cache' \
            --exclude='STATUS.md' \
            --exclude='NODE-2.0.md' \
            --exclude='NODE-1.3.md' \
            --exclude='STRUCTURAL-REVIEW-1.2.md' \
            --exclude='REFACTORING_PLAN.md' \
            --exclude='NODE_LIBRARY_REGRESSION_PLAN.md' \
            --exclude='1.2*.md' \
            --exclude='AGENTS.md' \
            --exclude='GEMINI.md' \
            --exclude='AI.md' \
            --exclude='TECHNOLOGIES.md' \
            --exclude='skills-lock.json' \
            --exclude='gemini_targets.txt' \
            --exclude='package.json' \
            --exclude='bun.lock' \
            --exclude='vite.config.js' \
            --exclude='HOW_TO_RELEASE.md' \
            --exclude='CHANGELOG.md' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='assets/css/main.css' \
            --exclude='assets/css/material3.css' \
            --exclude='plugins-embedded/node-seo-tools/assets/share/fonts/NotoSansJP-VF.ttf' \
            ./ "$tmpdir/Node/"
          (cd "$tmpdir" && zip -qr "$repo_dir/node.zip" Node)
          test "$(stat -c%s "$repo_dir/node.zip")" -lt 10485760

      - name: Commit package and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/package-refresh.yml
          git add -A node.zip .github/workflows/package-refresh.yml
          git commit -m "chore(release): refresh Node 1.3.2 package [package-refresh]"
          git push origin HEAD:master
